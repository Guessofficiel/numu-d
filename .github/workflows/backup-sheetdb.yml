name: Backup SheetDB

on:
  schedule:
    # Tous les jours a 03h00 UTC (~ 03h/04h heure du Mali selon la saison)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Recuperer les donnees SheetDB et generer le fichier de sauvegarde
        run: node .github/scripts/backup-sheetdb.js

      - name: Commit et push si des changements existent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sheetdb-backup.json
          if git diff --staged --quiet; then
            echo "Aucun changement dans les donnees, pas de commit."
          else
            git commit -m "chore: sauvegarde quotidienne des donnees SheetDB"
            git push
          fi
